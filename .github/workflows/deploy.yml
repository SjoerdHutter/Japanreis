name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nodig voor het publiceren naar Pages; verder heeft de workflow geen rechten.
permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk. Een nieuwe push wacht netjes op de vorige.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # LET OP: Pages moet één keer met de hand aangezet worden, in
      # Settings, Pages, bij Source kiezen voor "GitHub Actions". Daarna draait
      # deze workflow vanzelf bij elke push naar main.
      #
      # `enablement: true` op deze actie lijkt dat te kunnen automatiseren, maar
      # dat werkt hier niet: het aanmaken van een Pages-site vraagt
      # beheerdersrechten die de GITHUB_TOKEN niet heeft, en de poging faalt met
      # "Resource not accessible by integration". Dat is een onduidelijker
      # foutmelding dan de standaardmelding, die wél naar de instellingen wijst.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
