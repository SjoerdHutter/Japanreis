name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nodig voor het publiceren naar Pages; verder heeft de workflow geen rechten.
permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk. Een nieuwe push wacht netjes op de vorige.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # `enablement` zet Pages aan als dat nog niet gebeurd is. Zonder deze
      # regel faalt de eerste deploy met "Get Pages site failed", en dan moet
      # iemand het met de hand aanzetten in de instellingen van de repo. De
      # workflow heeft er al de rechten voor; die staan hierboven.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
