# Per regel het schrift (kanji als dat gebruikelijk is), de kana, de romaji
# zoals je hem op een Engelstalige kaart ziet, een Nederlandse omschrijving en
# de allergenen die er gewoonlijk in zitten. Dat laatste is een vuistregel:
# elke zaak doet het anders, en dashi, sojasaus en mirin zitten op onverwachte
# plekken. Vraag het na met de kaart "toon aan personeel".
