# Ongeveer de laatste praktische vertrektijd van een knooppunt in de reis naar
# een station waar je waarschijnlijk 's avonds heen moet.
#
# LET OP: dit is een BENADERING uit algemene kennis, niet uit een dienstregeling.
# De laatste trein verschilt per weekdag en per seizoen, en "praktisch" is hier
# de laatste die je nog zonder gedoe haalt, niet de allerlaatste die misschien
# rijdt. Elke regel heeft `gecontroleerd: false`; kijk de tijden na in Google
# Maps of Jorudan en vul in de app je eigen tijd in waar je het beter weet.
#
# `stad` is de stad van het knooppunt (waar je je dag plant), `naar` het
# station waar je naartoe moet en `naarStad` de stad daarvan. Een tijd voor
# 04:00 telt als na middernacht.
#
# De app kiest het knooppunt dat het dichtst bij je laatste stop ligt en zoekt
# de regel waarvan `naar` overeenkomt met het terugstation van je verblijf in
# Mijn gegevens. Takayama en Hanoi staan er niet in: in Takayama loop je, in
# Hanoi neem je een Grab.

