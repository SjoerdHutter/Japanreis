# Op het station. Eerst de borden, want die lees je vaker dan je iets vraagt:
# een Japans station is goed bewegwijzerd, maar het Engels staat er kleiner bij
# en op de kleine stations soms helemaal niet.

- id: bord-uitgang
  categorie: borden
  land: japan
  nederlands: Uitgang
  lokaal: 出口
  uitspraak: degoetsji
  wanneer: Geel bord. Grote stations hebben tientallen uitgangen, elk met een eigen naam of nummer.

- id: bord-windrichtingen
  categorie: borden
