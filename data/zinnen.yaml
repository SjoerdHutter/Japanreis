  uitspraak: higasjigoetsji, nisjigoetsji, minamigoetsji, kitagoetsji, tsjoeoogoetsji
  wanneer: >-
    De verkeerde kant uit kan op een groot station een kwartier omlopen kosten.
    Kijk in de stationsgids welke uitgang je wilt voordat je door de poortjes
    gaat.

