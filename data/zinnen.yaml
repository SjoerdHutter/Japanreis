# Offline zinnen met schrift, uit hoofdstuk 13.
#
# Het schrift staat erbij zodat je het kunt tonen aan iemand die geen Engels
# spreekt. Dat is het hele punt: wijzen werkt, uitspreken vaak niet.
#
# De uitspraak staat er in het Nederlands bij, niet in officiële romaji. "Sumimasen"
# lees je als Nederlander anders dan een Engelsman, en het gaat erom dat het
# aankomt.
#
# Onder `antwoorden` staat wat je terug kunt horen, in het schrift, zodat de
# ander het kan aanwijzen. Een rijtje dat bij meer zinnen hoort staat één keer
# met een anker (`- &richting-ja`) en komt elders terug als `- *richting-ja`;
# daarna kun je er per zin eigen antwoorden onder zetten. Het anker moet boven
# de eerste alias staan. De antwoorden zijn nieuw en nog niet nagekeken door een
# moedertaalspreker, vandaar `antwoordenGecontroleerd: false`.

- id: sorry-excuseer
  categorie: basis
  land: japan
  nederlands: Sorry, mag ik u iets vragen
  lokaal: すみません
  uitspraak: soemiemasen
  wanneer: Werkt als sorry, pardon en ober tegelijk. De nuttigste zin die er is.
  antwoorden:
    - lokaal: はい
      uitspraak: hai
      nederlands: Ja? Zegt u het maar
    - lokaal: はい、どうぞ
      uitspraak: hai, doozo
      nederlands: Ja, gaat uw gang
    - lokaal: 少々お待ちください
      uitspraak: sjoosjoo omatsji koedasai
      nederlands: Een momentje alstublieft
    - lokaal: ただいま伺います
      uitspraak: tadaima oekagaimas
      nederlands: Ik kom zo bij u
      uitleg: Hoor je in een restaurant als je de ober roept.
  antwoordenGecontroleerd: false

