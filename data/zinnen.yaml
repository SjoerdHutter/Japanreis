# Offline zinnen met schrift, uit hoofdstuk 13.
#
# Het schrift staat erbij zodat je het kunt tonen aan iemand die geen Engels
# spreekt. Dat is het hele punt: wijzen werkt, uitspreken vaak niet.
#
# De uitspraak staat er in het Nederlands bij, niet in officiële romaji. "Sumimasen"
# lees je als Nederlander anders dan een Engelsman, en het gaat erom dat het
# aankomt.

- id: sorry-excuseer
  categorie: basis
  land: japan
  nederlands: Sorry, mag ik u iets vragen
  lokaal: すみません
  uitspraak: soemiemasen
  wanneer: Werkt als sorry, pardon en ober tegelijk. De nuttigste zin die er is.

