# Uit een Instagrampost van @itsgracechin, aangevuld met wat er online over te
# vinden was. Nog niet nagekeken, vandaar gecontroleerd: false. Waar een pin
# geschat is staat coordinaatGeschat: true; Yoshidaen heeft nog geen pin, omdat
# het adres niet te vinden was.

- id: wakakusayama
  naam: Wakakusayama
  naamLokaal: 若草山
  stad: nara
  categorie: attractie
  coordinaten: { lat: 34.691, lon: 135.8542 }
  beschrijving: >-
    Grasheuvel aan de oostkant van Nara park, met vanaf de top uitzicht over de
    hele stad. Er grazen herten, maar er lopen veel minder mensen dan beneden in
    het park. De ingangen liggen aan de voet van de heuvel; reken op een stevige
    klim van een half uur naar de top.
  waarom: >-
    Het uitzicht is spectaculair en je hebt de herten bijna voor jezelf, zegt de
    Instagrampost.
  openingstijden:
    osm: 'Mar-Dec 09:00-17:00'
    tekst: >-
      Ongeveer van half maart tot half december, 9:00 tot 17:00. In de winter
      dicht, behalve tijdens het grasbranden op de vierde zaterdag van januari.
  prijs: { bedrag: 150, valuta: JPY }
  prijzen:
    - { omschrijving: Volwassenen, bedrag: 150 }
    - { omschrijving: Kinderen op de basisschool, bedrag: 80 }
  tips:
    - Voor de zonsondergang moet je voor sluitingstijd binnen zijn, niet ervoor arriveren.
  tijdvakken: [nara]
  attractie:
    type: uitzichtpunt
    bezoekduurMinuten: 90
    regenbestendig: false
    dagdeel: [middag]
  bronnen:
    - naam: '@itsgracechin op Instagram'
    - naam: narashikanko.or.jp
      url: https://narashikanko.or.jp/en/?p=778
      gecontroleerdOp: 2026-10-09
  tags: [instagram]
  gecheckt: 2026-10-09
  gecontroleerd: false

