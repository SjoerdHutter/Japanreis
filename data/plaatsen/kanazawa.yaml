- id: shigure-tei
  naam: Shigure-tei
  naamLokaal: 時雨亭
  stad: kanazawa
  categorie: eten
  coordinaten: { lat: 36.5605, lon: 136.6605 }
  coordinaatGeschat: true
  adres: 1-5 Kenrokumachi, Kanazawa, Ishikawa 920-0936
  beschrijving: >-
    Theehuis binnen Kenrokuen, herbouwd op de plek van het origineel uit de
    zeventiende eeuw. Je zit op tatami met uitzicht op de tuin en krijgt matcha
    met een zoetigheid. Geen ceremonie van een uur maar een pauze van twintig
    minuten, en daarmee de laagdrempeligste manier om het een keer te doen.
  openingstijden:
    standaard: 09:00-16:00
  prijs: { bedrag: 310, tot: 1000, valuta: JPY, toelichting: Afhankelijk van de set }
  eten:
    keuken: thee
    moeite: snelle-bak
