# Kanazawa. Overgenomen uit de gedeelde Google Maps lijst, opgehaald op
# 6 september 2026. Openingstijden en prijzen zijn niet ter plaatse
# geverifieerd; zie de kop van tokio.yaml.
#
# Bij een aantal winkels en theehuizen staat `coordinaatGeschat: true`. Een
# Japans adres wijst een blok aan en geen deur, dus die pin kan honderd meter
# naast het pand liggen. De naam en het adres kloppen wel.

- id: kenrokuen
  naam: Kenrokuen
  naamLokaal: 兼六園
  stad: kanazawa
  categorie: attractie
  coordinaten: { lat: 36.5622, lon: 136.6626 }
  adres: 1-1 Kenrokumachi, Kanazawa, Ishikawa 920-0936
  beschrijving: >-
    Een van de drie grote tuinen van Japan, aangelegd door de Maeda's over twee
    eeuwen. De naam betekent tuin van de zes eigenschappen, die volgens de
    Chinese leer niet samen kunnen gaan: ruimte en afzondering, aanleg en
    ouderdom, water en uitzicht. Anderhalf uur is genoeg voor de hele lus.
    Staat zelf niet op de Google Maps lijst, maar de poort, het theehuis en het
    restaurant die er wel op staan liggen er allemaal in, dus zonder de tuin
    zelf hangen die punten in de lucht.
  openingstijden:
    standaard: 08:00-17:00
    opmerking: In de winter een uur later open en eerder dicht.
  prijs: { bedrag: 320, valuta: JPY }
  tijdvakken: [edo, meiji]
  attractie:
    type: tuin
    bezoekduurMinuten: 90
    regenbestendig: false
    dagdeel: [ochtend, middag]
    drukte:
      besteMoment: Bij opening, of het laatste uur.
      drukstMoment: 10:00 tot 15:00.
  bronnen:
    - naam: Kenrokuen, prefectuur Ishikawa
      url: http://www.pref.ishikawa.jp/siro-niwa/kenrokuen/
      gecontroleerdOp: 2026-09-06

- id: kanazawa-jo
  naam: Kasteel Kanazawa
  naamLokaal: 金沢城
  stad: kanazawa
  categorie: attractie
  coordinaten: { lat: 36.5654, lon: 136.6592 }
  adres: 1-1 Marunouchi, Kanazawa, Ishikawa 920-0937
  beschrijving: >-
    Het kasteelterrein ligt direct naast Kenrokuen, alleen gescheiden door een
    brug. Het park is gratis en dag en nacht toegankelijk; alleen de herbouwde
    binnengebouwen kosten entree. De witte daken zijn van lood, oorspronkelijk
    zodat het in geval van beleg tot kogels omgesmolten kon worden.
  openingstijden:
    standaard: Park dag en nacht open
    opmerking: >-
      Google Maps vermeldt geen tijden voor het park. De gebouwen binnen het
      terrein hebben wel eigen openingstijden, ruwweg 09:00-16:30.
  prijs: gratis
  tijdvakken: [edo, meiji]
  attractie:
    type: kasteel
    bezoekduurMinuten: 60
    regenbestendig: false
    dagdeel: [ochtend, middag, avond]
  bronnen:
    - naam: Kasteel Kanazawa, prefectuur Ishikawa
      url: http://www.pref.ishikawa.jp/siro-niwa/kanazawajou/
      gecontroleerdOp: 2026-09-06
  tags: [google-maps-lijst]

