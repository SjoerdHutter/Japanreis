    keuken: okonomiyaki
    lateNight: true
    moeite: waardig-een-omweg
  bronnen:
    - naam: Okonomimura
      url: http://okonomimura.jp/index.html
      gecontroleerdOp: 2026-09-06
  tags: [google-maps-lijst]

