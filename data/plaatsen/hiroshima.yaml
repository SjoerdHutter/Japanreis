# Startset voor Hiroshima. Zie de kop van tokio.yaml: niet ter plaatse geverifieerd.

- id: genbaku-dome
  naam: Atoomkoepel
  naamLokaal: 原爆ドーム
  stad: hiroshima
  categorie: attractie
  coordinaten: { lat: 34.3955, lon: 132.4536 }
  adres: 1-10 Otemachi, Naka Ward, Hiroshima, 730-0051
  beschrijving: >-
    De ruïne van de tentoonstellingshal, vrijwel recht onder het punt waar de
    bom op 6 augustus 1945 ontplofte. Het skelet is bewust gelaten zoals het die
    ochtend achterbleef. Van buitenaf te bekijken, dag en nacht.
  prijs: gratis
  tijdvakken: [meiji, naoorlogs]
  attractie:
    type: monument
    bezoekduurMinuten: 20
    regenbestendig: false
    dagdeel: [ochtend, middag, avond]
  tags: [google-maps-lijst]

- id: vredesmuseum
  naam: Vredesmuseum Hiroshima
  naamLokaal: 広島平和記念資料館
  stad: hiroshima
  categorie: attractie
  coordinaten: { lat: 34.3915, lon: 132.4519 }
  adres: 1-2 Nakajimacho, Naka Ward, Hiroshima, 730-0811
  beschrijving: >-
    Het museum vertelt de dag vanuit de mensen die hem meemaakten, met
    persoonlijke voorwerpen en getuigenissen. Zwaar en zorgvuldig gedaan. Neem
    er ruim de tijd voor en plan er niets belastends achteraan.
  openingstijden:
    standaard: 08:30-18:00
    laatsteToegang: '17:30'
    opmerking: In augustus tot 19:00, van december tot februari tot 17:00.
  prijs: { bedrag: 200, valuta: JPY }
  tijdvakken: [naoorlogs]
  attractie:
    type: museum
    bezoekduurMinuten: 120
    regenbestendig: true
    dagdeel: [ochtend, middag]
  bronnen:
    - naam: Hiroshima Peace Memorial Museum
      url: https://hpmmuseum.jp/
  tags: [google-maps-lijst]

- id: vredespark
  naam: Vredespark
  naamLokaal: 平和記念公園
  stad: hiroshima
  categorie: attractie
  coordinaten: { lat: 34.3933, lon: 132.4526 }
  beschrijving: >-
    Het park ligt op de plek van de wijk die volledig werd weggevaagd. De
    cenotaaf, de kinderklokken en de eeuwige vlam staan in één lijn met de
    koepel; dat is met opzet zo ontworpen.
  prijs: gratis
  tijdvakken: [naoorlogs]
  attractie:
    type: park
    bezoekduurMinuten: 60
    regenbestendig: false
    dagdeel: [ochtend, middag]

- id: itsukushima
  naam: Itsukushima schrijn, Miyajima
  naamLokaal: 厳島神社
  stad: hiroshima
  categorie: attractie
  coordinaten: { lat: 34.296, lon: 132.3199 }
  adres: 1-1 Miyajimacho, Hatsukaichi, Hiroshima 739-0588
  beschrijving: >-
    De schrijn staat op palen in zee, met de rode poort ervoor. Bij vloed lijkt
    alles te drijven, bij eb loop je er tussen de schelpen naartoe. Kijk vooraf
    het getij op, want dat bepaalt volledig wat je ziet.
  openingstijden:
    standaard: 06:30-18:00
    opmerking: Sluitingstijd verschuift per seizoen tussen 17:00 en 18:30.
  prijs: { bedrag: 300, valuta: JPY, toelichting: Plus 100 yen bezoekersheffing op het eiland }
  tijdvakken: [heian, muromachi]
  attractie:
    type: schrijn
    bezoekduurMinuten: 180
    regenbestendig: false
    dagdeel: [ochtend, middag]
    drukte:
      besteMoment: Eerste boot of laat in de middag, als de dagtrips weg zijn.
  goshuin:
    waar: Bij de uitgang van de schrijn, in het kantoor links.
    prijs: { bedrag: 300, valuta: JPY }
    openingstijden: { standaard: 08:00-16:30 }
  bronnen:
    - naam: Itsukushima schrijn
      url: https://www.itsukushimajinja.jp/
      gecontroleerdOp: 2026-09-06
  tags: [google-maps-lijst]

- id: shukkei-en
