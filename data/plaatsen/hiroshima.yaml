  stad: hiroshima
  categorie: attractie
  coordinaten: { lat: 34.4013, lon: 132.4661 }
  adres: 2-11 Kaminoboricho, Naka Ward, Hiroshima, 730-0014
  beschrijving: >-
    Wandeltuin uit 1620 die een heel landschap in het klein nabootst: bergen,
    een vallei en een meer met eilandjes. Verwoest in 1945 en daarna
    gereconstrueerd. Rustig, en op tien minuten lopen van het centrum.
  openingstijden:
    standaard: 09:00-18:00
    opmerking: Van oktober tot maart tot 17:00.
  prijs: { bedrag: 260, valuta: JPY }
