  attractie:
    type: tuin
    bezoekduurMinuten: 60
    regenbestendig: false
    dagdeel: [ochtend, middag]
  bronnen:
    - naam: Shukkei-en
      url: http://shukkeien.jp/
      gecontroleerdOp: 2026-09-06
  tags: [google-maps-lijst]

- id: okonomimura
  naam: Okonomimura
  naamLokaal: お好み村
  stad: hiroshima
  categorie: eten
  coordinaten: { lat: 34.3924, lon: 132.4602 }
  adres: 5-13 Shintenchi, Naka Ward, Hiroshima, 730-0034
  beschrijving: >-
    Drie verdiepingen met niets dan okonomiyaki-kraampjes. De Hiroshima-variant
