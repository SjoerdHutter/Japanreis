    regenbestendig: false
    dagdeel: [avond, nacht]

- id: tsukiji-buitenmarkt
  naam: Tsukiji buitenmarkt
  naamLokaal: 築地場外市場
  stad: tokio
  categorie: eten
  coordinaten: { lat: 35.6654, lon: 139.7707 }
  beschrijving: >-
    De vishal is naar Toyosu verhuisd, de buitenmarkt is gebleven. Rond een uur
    of acht 's ochtends op zijn best: tamagoyaki aan een stokje, gegrilde
    sint-jakobsschelpen en sushi aan de toonbank.
  openingstijden:
    standaard: 05:00-14:00
    perDag: { zondag: gesloten }
    opmerking: Veel zaken sluiten al rond het middaguur en ook op woensdag.
  prijs: { bedrag: 1000, tot: 4000, valuta: JPY }
  tijdvakken: [naoorlogs]
  eten:
    keuken: sushi
    ontbijt: true
    moeite: waardig-een-omweg

- id: omoide-yokocho
  naam: Omoide Yokocho
  naamLokaal: 思い出横丁
  stad: tokio
  categorie: eten
  coordinaten: { lat: 35.6935, lon: 139.6994 }
  beschrijving: >-
    Twee steegjes vol zaken met zes krukken, naast station Shinjuku. Rook,
    yakitori en bier. Ga vroeg, want na achten staat er een rij en zit je met
    zeven man op een plek voor vijf.
  openingstijden:
    standaard: 17:00-23:30
    opmerking: Per zaak verschillend; sommige gaan al om 12:00 open.
  prijs: { bedrag: 2000, tot: 4000, valuta: JPY }
  tijdvakken: [naoorlogs]
  eten:
    keuken: izakaya
    lateNight: true
    moeite: waardig-een-omweg

- id: isetan-depachika
  naam: Depachika Isetan Shinjuku
  naamLokaal: 伊勢丹新宿店 デパ地下
  stad: tokio
  categorie: eten
  coordinaten: { lat: 35.6917, lon: 139.7044 }
  beschrijving: >-
    De voedselkelder van een warenhuis is de goedkoopste manier om dure dingen
    te proeven. Het laatste uur voor sluitingstijd gaan bento's en gebak met
    korting weg.
  openingstijden:
    standaard: 10:00-20:00
  prijs: { bedrag: 800, tot: 3000, valuta: JPY }
  tijdvakken: [naoorlogs]
  eten:
    keuken: depachika
    moeite: snelle-bak

- id: station-tokio-stempel
  naam: Eki stamp station Tokio
  naamLokaal: 東京駅
  stad: tokio
  categorie: vervoer
  coordinaten: { lat: 35.6812, lon: 139.7671 }
  beschrijving: >-
    De stempel van station Tokio, met de bakstenen gevel van het Marunouchi-
    gebouw erop. Het eerste stempeltje van de reis, en meteen een goede oefening
    in zoeken: hij staat niet in het zicht.
  prijs: gratis
  tijdvakken: [meiji, naoorlogs]
  ekiStempel:
    waar: >-
      Aan de Marunouchi-kant, bij de noordelijke doorgang binnen de
      toegangspoortjes, naast het informatiekantoor. Vraag ernaar bij de balie
      als je hem niet ziet staan; het personeel wijst hem zonder morren aan.
    openingstijden: { standaard: 06:00-22:00 }
