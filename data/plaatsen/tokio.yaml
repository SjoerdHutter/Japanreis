  beschrijving: >-
    Met 634 meter de hoogste toren ter wereld, met twee uitkijkdekken op 350 en
    450 meter. Het hoge dek kost extra en levert vooral hoogte op, niet meer
    zicht: op 350 meter zie je de stad nog als stad. Bij helder weer staat Fuji
    aan de westkant. Aan de voet zit een winkelcentrum, dus met regen kun je er
    langer terecht.
