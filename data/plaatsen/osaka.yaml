    rij tussen 18:00 en 20:00.
  openingstijden:
    standaard: 11:00-23:00
  prijs: { bedrag: 1000, tot: 2500, valuta: JPY }
  tijdvakken: [naoorlogs]
  eten:
    keuken: okonomiyaki
    moeite: waardig-een-omweg

- id: tsuruhashi-yakiniku
  naam: Yakiniku in Tsuruhashi
  naamLokaal: 鶴橋
  stad: osaka
  categorie: eten
  coordinaten: { lat: 34.6656, lon: 135.5313 }
  beschrijving: >-
    De Koreaanse wijk rond station Tsuruhashi ruikt al naar houtskool zodra je
