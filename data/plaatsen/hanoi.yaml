- id: ho-chi-minh-mausoleum
  naam: Ho Chi Minh mausoleum
  naamLokaal: Lăng Chủ tịch Hồ Chí Minh
  stad: hanoi
  categorie: attractie
  rang: 6
  coordinaten: { lat: 21.0367, lon: 105.8347 }
  beschrijving: >-
    Het gebalsemde lichaam ligt in een marmeren zaal waar je in stilte langs
    loopt. Strenge kledingregels, geen tassen, geen handen in de zakken. In
    september en oktober vaak dicht voor onderhoud.
  waarom: Het belangrijkste politieke monument van Vietnam.
  adres: Ba Dinh plein, Hung Vuong
  adresLokaal: Quảng trường Ba Đình, Hùng Vương, Hà Nội
  web: https://bqllang.gov.vn
  openingstijden:
    standaard: 07:30-10:30
    perDag: { maandag: gesloten, vrijdag: gesloten }
  geslotenOpmerking: >-
    Jaarlijks meerdere weken gesloten voor onderhoud, meestal in het najaar.
  sluitingen:
    - van: 2026-09-04
      tot: 2026-11-02
      reden: >-
        Jaarlijks onderhoud, weer open vanaf 3 november 2026. Een andere bron
        noemt 5 september tot en met 3 november.
  prijs: gratis
  prijzen:
    - { omschrijving: Toegang, bedrag: 0 }
  letOp:
    - >-
      Dicht voor onderhoud van 4 september tot en met 2 november 2026. Het plein
      en de omgeving blijven bezoekbaar.
    - Knieën en schouders bedekt, geen hemdjes of korte rokken.
  tijdvakken: [onafhankelijkheid]
  attractie:
    type: monument
    bezoekduurMinuten: 60
    regenbestendig: false
    dagdeel: [ochtend]
    drukte:
      besteMoment: Ruim voor 09:00, want de rij loopt snel op en het sluit om 10:30.
  bronnen:
    - naam: lanytrip.com
      url: https://www.lanytrip.com/en/blogs/north-vietnam-attractions/hanoi-ho-chi-minh-mausoleum-guide
      gecontroleerdOp: 2026-10-01
  gecheckt: 2026-10-01
  gecontroleerd: false

