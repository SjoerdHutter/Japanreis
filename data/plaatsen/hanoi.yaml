  categorie: attractie
  rang: 1
  coordinaten: { lat: 21.0287, lon: 105.8524 }
  beschrijving: >-
    Het meer in het hart van de stad, met de rode brug naar het tempeltje op het
    eilandje. Rondom loopt iedereen 's ochtends vroeg te sporten. In het weekend
    gaan de straten eromheen dicht voor verkeer.
  waarom: >-
    Symbool van de stad en het logische startpunt. Vrijwel alles in de Oude Stad
    ligt op loopafstand.
  adres: Dinh Tien Hoang, Hoan Kiem
  adresLokaal: Hồ Hoàn Kiếm, Đinh Tiên Hoàng, Hà Nội
  openingstijden:
    osm: '24/7'
    tekst: Altijd toegankelijk
  prijs: gratis
  prijzen:
    - { omschrijving: Toegang, bedrag: 0 }
  tips:
    - Van vrijdagavond tot en met zondagavond is het gebied rond het meer autovrij.
  tijdvakken: [thang-long, frans-koloniaal, modern]
  attractie:
    type: water
    bezoekduurMinuten: 45
    regenbestendig: false
    dagdeel: [ochtend, avond]
    drukte:
      besteMoment: Vroeg in de ochtend, als locals tai chi doen, of in de avond
  bronnen:
    - naam: vietnamairlines.com
      url: https://www.vietnamairlines.com/us/en/plan-book/travel/travel-guide/what-to-visit-in-hanoi
      gecontroleerdOp: 2026-10-01
  gecheckt: 2026-10-01
  gecontroleerd: false

