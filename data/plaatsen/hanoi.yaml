# Startset voor Hanoi. Zie de kop van tokio.yaml: niet ter plaatse geverifieerd.
#
# Hanoi is in deze app een volwaardige stad en geen bijlage. De punten hieronder
# liggen vrijwel allemaal binnen een halfuur lopen van het Hoan Kiem-meer, zodat
# ze ook met een korte overstap haalbaar zijn.
#
# Op 1 oktober 2026 is hier een onderzochte set plekken bij gekomen: een Top 20
# van bezienswaardigheden (veld rang), eten en drinken bij die plekken, en vijf
# spa's. De feiten komen uit openbare bronnen en staan op gecontroleerd: false,
# zodat de app er "controleren" bij zet tot je ze zelf hebt nagekeken. Tien van
# die plekken stonden er al; daar zijn alleen de velden aangevuld die nog
# ontbraken en is niets bestaands overschreven. Nieuwe plekken zonder
# coördinaten krijgen die met `npm run geocodeer`; tot dan staan ze in de app
# onder "Locatie ontbreekt".

