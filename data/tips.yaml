# Reisadvies uit de opgeslagen Instagram collectie.
#
# 77 posts, thematisch geordend. Bij het merendeel van de reels staat de
# inhoudelijke informatie in beeld of wordt die gesproken en niet in het
# bijschrift; wat hier staat is wat er wel uit te halen was.
#
# Over de bedragen: in de tekst staan plaatshouders als {0} en {1}, geen
# uitgeschreven euro's. Het scherm vult ze in met de centrale valutahelper, dus
# de euro tussen haakjes beweegt mee met de koers en er is precies één plek waar
# die vandaan komt. Zie src/domein/schema/tips.ts.
#
# Waar posts elkaar tegenspreken staat dat er expliciet bij. Doen alsof er
# consensus is die er niet is, is erger dan de tegenspraak laten staan.

herkomst: Opgeslagen Instagram collectie Japan, 77 posts
verzameldOp: 2026-09-06

groepen:
  - id: voorbereiding
    titel: Voorbereiding en aankomst
    land: [japan]
    inleiding: Wat je geregeld wil hebben voordat je op het vliegtuig stapt.
    tips:
      - tekst: >-
          Vul Visit Japan Web volledig in zodra vluchten en accommodatie geboekt
          zijn. Je krijgt een QR code voor immigratie en douane waarmee je de
          snelle rij mag gebruiken. Maak er een screenshot van, dan ben je niet
          afhankelijk van netwerk op het vliegveld.
      - tekst: >-
          Laad je Suica kaart vooraf op. Op een iPhone kan dat via Apple Wallet.
          Met Android moet je een fysieke kaart kopen op het treinstation van de
          luchthaven.
      - tekst: >-
          Regel een eSIM enkele dagen tot weken voor vertrek. Pocket wifi of een
          simkaart kopen op de luchthaven is aanzienlijk duurder.
      - tekst: >-
          Bepaal vooraf welk vervoer je vanaf de luchthaven neemt. Dat scheelt
          zoeken en geld op de dag van aankomst zelf.
      - tekst: >-
          Boek deze zaken ruim vooraf, ze zijn vrijwel altijd uitverkocht:
          Shinkansen en limited express treinen in het hoogseizoen, het Ghibli
          Museum, Shibuya Sky en zeker het zonsondergangslot, het Pokemon Cafe in
          Tokio en Osaka, en de Sagano Scenic Railway. Voor het Pokemon Cafe
          geldt dat annuleringen vaak vrijkomen; kijk de avond ervoor nog een keer.
        bron: '@luca_castagnini_'

  - id: vervoer
    titel: Vervoer
    land: [japan]
    tips:
      - tekst: >-
          De snelle luchthaventrein is een verkapte toeristenbelasting. De Narita
          Express kost {0}, de Access Express ernaast {1} en is slechts zeven
          minuten langzamer. Op Kansai staat de Haruka voor {2} naast de Nankai
          voor {3}, die zelfs sneller in Namba is. Op Haneda kost de Keikyu {4}.
        bedragen:
          - { bedrag: 22, valuta: EUR, toelichting: In de post genoemd in dollars }
          - { bedrag: 9, valuta: EUR }
          - { bedrag: 20, valuta: EUR }
          - { bedrag: 10, valuta: EUR }
          - { bedrag: 3, valuta: EUR }
        bron: '@nomadminh'
      - tekst: >-
          Met veel bagage is de airport limousine bus het overwegen waard,
          ongeveer {0}. Je koopt het ticket aan een balie in de terminal, er is
          echte bagageruimte en de bus zet je dichter bij je hotel af dan welke
          trein dan ook.
        bedragen: [{ bedrag: 9, valuta: EUR }]
        bron: '@nomadminh'
      - tekst: >-
          Tussen Osaka en Kyoto hoef je niet de Shinkansen van ongeveer {0} te
          nemen. De Hankyu Kyo-train Garaku doet Osaka-umeda naar
          Kyoto-kawaramachi in 45 minuten voor {1}, zonder reserveringstoeslag.
          Elk rijtuig staat voor een seizoen, met tatami, bamboeschermen en echte
          rotstuinen. Rijdt alleen vier keer per dag, in het weekend en op
          feestdagen.
        bedragen:
          - { bedrag: 30, valuta: EUR }
          - { bedrag: 400, valuta: JPY }
        stad: kyoto
      - tekst: >-
          De Aoniyoshi Sightseeing Train verbindt Kyoto, Nara en Osaka en je mag
          koffers meenemen. Boek vroeg, alle plaatsen zijn gereserveerd. Kies
          tussen twin seats en saloon seats, selecteer je stoel op de plattegrond
          en betaal online. Let op dat het tijdslot daadwerkelijk Aoniyoshi
          vermeldt.
        bron: '@themamawhotravels'
      - tekst: >-
          De Hokuriku route is een compact alternatief voor twee nachten:
          Kanazawa, Shirakawa-go, Takayama en Nagoya, met samoeraiwijken, UNESCO
          dorpen en uitstekend rundvlees.
        stad: kanazawa

  - id: apps
    titel: Apps en digitale hulpmiddelen
    land: [japan]
    inleiding: Aanvullend op de appgids elders in deze app.
    tips:
      - tekst: >-
          Suica voor treinen, bussen en betalingen bij de konbini. Je tapt met je
          telefoon, ook met het scherm uit.
      - tekst: >-
          NAVITIME voor routes, perrons, overstaptijden, tarieven en zelfs de
          beste uitgang van een station. Volledig in het Engels.
      - tekst: >-
          Tabelog voor restaurants waar locals komen. Let op het Tabelog 100
          keurmerk, dat zijn de beste adressen van het jaar.
      - tekst: GO Taxi om zonder taalbarriere een taxi te bestellen, landelijk beschikbaar.
      - tekst: Klook voor tickets, tours en activiteiten die je vooraf boekt.

  - id: besparen
    titel: Geld besparen
    land: [japan]
    tips:
      - tekst: >-
          Koop drank en verpakt eten in de supermarkt in plaats van de konbini.
          Vaak de helft van de prijs. Zoek op het Japanse woord voor supermarkt
          in Google Maps om de dichtstbijzijnde te vinden.
      - tekst: >-
          Ga na 19:00 naar de supermarkt voor bento boxen. Alle kant en klare
          maaltijden krijgen dan afprijzingen tot tachtig procent.
      - tekst: >-
          Koop geen flessenwater, het kraanwater is veilig. Een waterfilterflesje
          uit een 100 yen winkel, {0}, is genoeg als je twijfelt.
        bedragen: [{ bedrag: 100, valuta: JPY }]
      - tekst: >-
          Eet duur tijdens de lunch in plaats van het diner. Dezelfde restaurants
          bieden set lunches die veel goedkoper zijn.
      - tekst: >-
          Ga niet alleen naar virale adressen. Bij een ketenrestaurant eet je een
          volwaardige Japanse maaltijd vanaf {0}.
        bedragen: [{ bedrag: 500, valuta: JPY }]
      - tekst: >-
          Wissel geen geld op toeristische plekken en vraag niet standaard om de
          Engelse kaart; in beide gevallen betaal je meer.
      - tekst: Vermijd overnachten in centraal Shibuya of Shinjuku als je op de prijs let.
        stad: tokio

  - id: winkelen
    titel: Winkelen algemeen
    land: [japan]
    tips:
      - tekst: >-
          Koop merken als Onitsuka Tiger, Gelato Pique en high end labels niet in
          de flagship store. Warenhuizen geven vaak vijf tot tien procent
          toeristenkorting bovenop de tien procent tax refund.
        bron: '@itsgracechin'
      - tekst: >-
          Download de gratis kortingscoupons van ketens als Don Quijote, BIC
          Camera, JINS, Alpen en de bekende drogisterijen. Dat levert nog eens
          vijf tot tien procent op.
        bron: '@itsgracechin'
      - tekst: >-
          Voor souvenirs is Kappabashi Kitchenware Town in Tokio een beter adres
          dan Don Quijote. Matcha kommen, handgemaakte eetstokjes en
          stokjeshouders zijn er goedkoper en unieker.
        stad: tokio
        bron: '@deannawoo'
      - tekst: >-
          Als je te veel koopt: de opvouwbare tas van 3COINS kost {0} en houdt
          ongeveer 20 kg, vergelijkbaar met de ruimbagagelimiet van de meeste
          luchtvaartmaatschappijen. Materiaal vergelijkbaar met de IKEA tas en
          stevig genoeg om zonder extra bescherming in te checken.
        bedragen: [{ bedrag: 550, valuta: JPY }]
        bron: '@erwinandnigel'

  - id: vintage
    titel: Vintage en tweedehands
    land: [japan]
    inleiding: >-
      Het onderwerp waar deze collectie het meest over te zeggen heeft, en waar
      de posts elkaar ook het duidelijkst tegenspreken.
    tips:
      - tekst: >-
          Begin een luxe vintage zoektocht in Osaka, niet in Tokio. Osaka heeft
          meer concurrentie tussen winkels, snellere doorstroom van voorraad,
          meer ruimte om over de prijs te praten en vooral lokale kopers. Tokio
          heeft de zeldzaamste stukken maar hogere prijzen en nauwelijks
          onderhandelingsruimte. Reken op minimaal twee volle dagen in Osaka.
        stad: osaka
        bron: '@mayatrends'
      - tekst: >-
          Aanbevolen adressen in Osaka: Paradise Vintage, ALLU Vintage, Brand
          Off, Komehyo en Okura.
        stad: osaka
        bron: '@mayatrends'
      - tekst: >-
          In Tokio wordt MixTHINKS in Harajuku genoemd als de ene stop die je
          niet mag missen, met een sterke Chanel selectie, een hele verdieping
          met tassen en een achterkamer met koopjes. Er wordt onderhandeld, dus
          vraag er altijd naar.
        stad: tokio
      - tekst: >-
          De beste prijzen in Tokio zitten niet in Omotesando, dat juist het
          duurst bleek, maar in Ginza en rond Ueno. Daar werden vintage Chanel
          klepstukken gevonden voor ongeveer {0}, een derde van de Britse prijs.
        bedragen: [{ bedrag: 1500, valuta: EUR, toelichting: In de post genoemd in ponden }]
        stad: tokio
        bron: '@manindersachdeva'
      - tekst: >-
          Categorieindeling van de Tokiose winkels: Tampopo House en King Family
          voor echte koopjes, BOOKOFF en Mode Off voor betaalbaar tweedehands met
          soms merkstukken, 2nd STREET en Treasure Factory Cle voor gecureerde
          merkkleding.
        stad: tokio
        bron: '@sara_34chi_'
      - tekst: >-
          Buiten het centrum: Super 2nd Street Saitama en BOOKOFF SUPER BAZAAR
          Omiya Stellar Town, beide in Saitama. Safari Koenji wordt genoemd als
          adres voor vintage Ralph Lauren.
        stad: tokio
        bron: '@klaize711'
      - tekst: >-
          Thrift juist niet in Tokio en Osaka, want daar is het duurder, maar in
          steden als Sapporo en Fukuoka.
        tegenspraak: >-
          Dit spreekt de andere posts in deze groep tegen, die Osaka juist
          aanraden. Het verschil zit hem waarschijnlijk in wat je zoekt: dit gaat
          over gewoon tweedehands, de andere posts over luxe designertassen.
        bron: '@itsgracechin'

  - id: markten
