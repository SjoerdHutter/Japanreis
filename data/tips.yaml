        bedragen:
          - { bedrag: 330, tot: 550, valuta: JPY }
          - { bedrag: 1100, valuta: JPY }
        stad: tokio

  - id: eten
    titel: Eten en drinken
    land: [japan]
    tips:
      - tekst: >-
          Tsukiji Market is de grootste toeristenval van Tokio. Loop twee minuten
          door naar Tsukiji Uogashi, twee met elkaar verbonden gebouwen, waar
          dezelfde vis fors goedkoper is. Een toro bowl is er bijna twee keer
          goedkoper en toro nigiri vier keer. Een hele bak uni kostte {0}
          tegenover een klein bakje voor {1} in Tsukiji zelf. Er is bovendien een
          eetzaal met handenwasgelegenheid en voldoende toiletten.
        bedragen:
          - { bedrag: 3000, valuta: JPY }
          - { bedrag: 2000, valuta: JPY }
        stad: tokio
        bron: '@itsgracechin'
      - tekst: >-
          Nakiryu in Toshima wordt genoemd als goedkoopste Michelin ster ramen van
          Japan. In Kyoto doen Men-ya Inoichi en Men-ya Inoichi Hanare hetzelfde
          voor onder de {0}. Bij de ene vestiging schrijf je je naam op voor een
          tijdslot, bij de andere sluit je buiten aan. Wachttijd ongeveer twintig
          minuten.
        bedragen: [{ bedrag: 10, valuta: EUR, toelichting: In de post genoemd in dollars }]
        stad: kyoto
      - tekst: >-
          Omakase in drie prijsklassen in Tokio: Sushi Azabu circa dertien gangen
          voor {0}, Mantensushi Marunouchi twintig tot vijfentwintig gangen voor
          {1}, en Ebisu Sushi Kenshin twintig gangen met wijnarrangement voor {2}
          of zonder arrangement {3}.
        bedragen:
          - { bedrag: 4800, valuta: JPY }
          - { bedrag: 8800, valuta: JPY }
          - { bedrag: 30000, valuta: JPY }
          - { bedrag: 19000, valuta: JPY }
        stad: tokio
        bron: '@girleatsin'
      - tekst: >-
          Ginza Sushi Banya Kai wordt aanbevolen voor een omakase van twintig
          gangen voor {0}, met gedrukte Engelse menukaarten.
        bedragen: [{ bedrag: 63, valuta: EUR, toelichting: In de post genoemd in dollars }]
        stad: tokio
        bron: '@itshelenmelon'
      - tekst: >-
          Een tonijn omakase van acht gangen in Tokio kost ongeveer {0}.
          Reserveren via TableCheck en minimaal een maand vooraf. Tafels voor twee
          zijn vrijwel niet te krijgen; een tafel voor vier boeken en op de dag
          zelf een couvert annuleren kostte {1}.
        bedragen:
          - { bedrag: 4000, valuta: JPY }
          - { bedrag: 2000, valuta: JPY }
        stad: tokio
        bron: '@saltandshaikh'
      - tekst: >-
          Osaka top vijf: Kitan Hibiki met een wagyu burger, Tokito voor een steak
          sandwich, klein en zonder reservering, Grenier Patisserie, Matcha 587 en
          Kuromonmaru voor melonijs. Eervolle vermelding voor Maguroya Kurogin
          voor tonijn, prijzig en druk, dus ga vroeg.
        stad: osaka
        bron: '@cloutom'
      - tekst: >-
          Kanizen in Shinsaibashi wordt genoemd voor levende krab, aan tafel
          bereid. Contant en pin allebei goed.
        stad: osaka
        bron: '@koyamas_travel10'
      - tekst: >-
          Kyoto staat bekend om unagi van hoge kwaliteit, de moeite waard om
          minimaal een keer te proberen. Sommige zaken rekenen per portie af,
          prettig als je een kleine eter bent.
        stad: kyoto

  - id: tokio
    titel: Tokio
    land: [japan]
    tips:
      - tekst: >-
          Todoroki Valley is na drie jaar sluiting weer open sinds maart 2026.
          Het is het enige natuurlijke ravijn in de 23 wijken van Tokio, ongeveer
          twintig minuten van Shibuya, ingang bij de rode Golf Bridge naast
          station Todoroki. Gratis en het hele jaar open.
        stad: tokio
        bron: '@tokyo24h.journey'
      - tekst: >-
          Drie ondergewaardeerde plekken: Kyu Asakura House, een bewaard gebleven
          traditioneel huis met tuinen; Momiji-no-Taki, een klein park met
          waterval; en Hie Shrine, een tunnel van rode torii poorten zonder de
          drukte.
        stad: tokio
        bron: '@wheretonextguys'
      - tekst: >-
          Head spa bij Rabbicour in Ginza. Reserveren verplicht, geen inloop, en
          enkele weken vooruit boeken. Je kiest zelf de themakamer. Er zijn twee
          vestigingen, dus kijk bij de andere als je tijdslot vol is.
        stad: tokio
        bron: '@greenonionbun'
      - tekst: >-
          OttersFamily in Jingumae, Shibuya, voor een sessie van vijfentwintig
          minuten met otters voor {0}. Doordeweeks 10:45 tot 18:30, in het
          weekend 11:00 tot 18:45. Er hangt een dierlijke geur; mondkapjes en
          kleding worden verstrekt.
        bedragen: [{ bedrag: 2000, valuta: JPY }]
        stad: tokio
      - tekst: >-
          Wood Works Kawagoe in Saitama, ongeveer dertig minuten van Tokio, waar
          je in een uur je eigen eetstokjes maakt. Engelstalig personeel.
        stad: tokio

  - id: kyoto
    titel: Kyoto en omgeving
    land: [japan]
    tips:
      - tekst: >-
          Arashiyama is meer dan alleen het bamboebos. De aanbevolen dagindeling
          is ontbijt bij een vroeg geopende onigiri zaak, daarna vroeg het
          bamboebos in, jetlag werkt in je voordeel, en vooral doorlopen tot
          voorbij het drukste stuk. Dan omhoog naar Otagi Nenbutsu-ji met meer dan
          duizend beeldjes met verschillende gezichtsuitdrukkingen, en tot slot
          unagi als lunch terug in het centrum. Verder in de route: verstopte
          tempels, het apenpark en koffie aan de rivier.
        stad: kyoto
      - tekst: >-
          De Hozugawa rivierboottocht start bij station JR Kameoka, acht minuten
          lopen, en vaart ook bij regen. Reserveren kan vooraf, maar inloop is ook
          mogelijk.
        stad: kyoto
        bron: '@hozugawakudari'
      - tekst: >-
          De wandeling van Kurama-dera naar Kifune duurt ongeveer een uur, kost
          {0} entree en voert langs 800 jaar oude ceders.
        bedragen: [{ bedrag: 500, valuta: JPY }]
        stad: kyoto
        bron: '@askastour.kyoto'
      - tekst: >-
          Kifune Shrine ligt ruim een uur van Kyoto Station, telt honderden
          lantaarns door het bos en is meer dan 1.600 jaar oud. Het is er ongeveer
          tien graden koeler dan in de stad, wat verklaart waarom locals er in de
          avond komen. Kawadoko, eten op een platform boven de rivier, is alleen
          in de zomer.
        stad: kyoto
        bron: '@japanwithmekyoto'
      - tekst: >-
          Hotel Village Kyoto in Omiya wordt aanbevolen voor ongeveer {0} per
          persoon per nacht, inclusief onsen van 15:00 tot middernacht, sake,
          snacks, matcha station en pyjama. Loopafstand van de metro, goed
          verbonden met de Nishiki markt en met de tram naar Arashiyama.
        bedragen: [{ bedrag: 35, valuta: EUR, toelichting: In de post genoemd in ponden }]
        stad: kyoto

  - id: nara
    titel: Nara
    land: [japan]
    inleiding: >-
      Staat niet in het reisschema, maar is een dagtrip vanuit Kyoto of Osaka en
      de collectie heeft er genoeg over te zeggen om het te overwegen.
    tips:
      - tekst: >-
          Begin bij Kasuga Taisha en loop naar beneden in plaats van omhoog.
          Vriendelijkere herten, minder drukte.
        stad: nara
      - tekst: >-
          De agressiefste herten staan bij de ingang waar de crackers verkocht
          worden. Loop dieper het park in, richting Araike Enchi, voor rustigere
          dieren.
        stad: nara
      - tekst: >-
          Voer geen herten bij de ingangen, buig naar ze en ze buigen terug, en ga
          vroeg in de ochtend of laat in de middag.
        stad: nara
      - tekst: >-
          De moeite waard: Todai-ji met de Grote Boeddha, de lantaarnpaden van
          Kasuga Taisha, Yugayama Enchi, het Ukimido paviljoen en optioneel een
          korte klim op Mount Wakakusa.
        stad: nara
      - tekst: >-
          Buiten het park: Naramachi met oude straten en traditionele huizen, en
          de Harushika sake brouwerij met een proefset voor ongeveer {0}.
        bedragen: [{ bedrag: 700, valuta: JPY }]
        stad: nara
      - tekst: >-
          Eetadressen: Nakatanidou voor de mochi demonstratie, Susuruka voor
          ramen, Soba-dokoro Kitahara voor soba, Hosekibako voor kakigori en
          Rokumei Coffee.
        stad: nara

  - id: fuji
    titel: Mount Fuji
    land: [japan]
    tips:
      - tekst: >-
          De ronde om Lake Kawaguchiko is ongeveer 18 km, grotendeels vlak met
          enkele korte klimmetjes, ook geschikt voor recreatieve fietsers.
          Fietshuur ligt rond {0} per dag, e-bikes beschikbaar.
        bedragen: [{ bedrag: 1600, tot: 2800, valuta: JPY }]
        stad: fujikawaguchiko
      - tekst: >-
          Rijd tegen de klok in, dan zit je aan de waterkant met het beste zicht
          op Fuji.
        stad: fujikawaguchiko
      - tekst: >-
          De Mishima Skywalk wordt genoemd als plek met goed zicht op de berg,
          waarbij het oversteken van de hangbrug zelf ook de moeite waard is.
        bron: '@sylvanavanbeek'

  - id: buiten-de-paden
    titel: Buiten de gebaande paden
    land: [japan]
    inleiding: >-
      Niet voor deze reis, want de route ligt vast, maar het staat in de
      collectie en is het bewaren waard.
    tips:
      - tekst: >-
          De standaardroute Tokio, Kyoto, Osaka is volgens een van de posts de
          reden dat reizen vol, gehaast en duur voelen. Het alternatief is Kyushu.
      - tekst: >-
          Route 1: begin in Osaka en neem de Sanyo Shinkansen van Shin-Osaka naar
          Hakata in Fukuoka, tweeënhalf uur en {0} enkele reis, ongeveer hetzelfde
          als Tokio naar Kyoto maar zonder de drukte. Reis vanaf Hakata verder per
          trein of auto.
        bedragen: [{ bedrag: 15000, tot: 16000, valuta: JPY }]
      - tekst: >-
          Route 2 met de beste doorstroom: vlieg in op Kagoshima, reis noordwaarts
          door Kyushu en vlieg uit vanaf Fukuoka. Geen dubbele trajecten.
      - tekst: >-
          Stops onderweg: Yufuin, een rustig onsen stadje met Ghibli dorp en
          vrediger dan Hakone; Beppu met hete bronnen en straatvoedsel gestoomd
          door de aarde; Mount Aso met vulkaan en open landschap; Takachiho Gorge
          met een boottocht door de waterval kloof; en Kirishima, een klein stadje
          met openbare voetenbaden.
      - tekst: >-
          In Kyushu zijn ryokan aanzienlijk goedkoper, zijn privé onsen af te
          huren en zijn de panoramatreinen niet overvol.

  - id: overnachten
    titel: Overnachten
    land: [japan]
    tips:
      - tekst: >-
          BSPK Shinjuku wordt aanbevolen voor ongeveer {0} per persoon per nacht
          in een driepersoonskamer, inclusief ontbijt, koffie en donuts overdag,
          een open bar in de avond en pyjama. Minder dan tien minuten lopen van
          station Shinjuku en rustig ondanks de ligging.
        bedragen: [{ bedrag: 60, valuta: EUR, toelichting: In de post genoemd in ponden }]
        stad: tokio
      - tekst: Village Kyoto in Omiya, zie de groep over Kyoto.
        stad: kyoto
      - tekst: Vermijd centraal Shibuya en Shinjuku als je op de prijs let.
        stad: tokio

  - id: souvenirs
    titel: Souvenirs en ervaringen
    land: [japan]
    tips:
      - tekst: >-
